name: Backend CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements/development.txt
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: workforce_test
          POSTGRES_USER: workforce
          POSTGRES_PASSWORD: workforce_test_pw
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U workforce"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: config.settings.development
      DJANGO_SECRET_KEY: ci-only-secret-key-not-for-production
      DATABASE_URL: postgres://workforce:workforce_test_pw@localhost:5432/workforce_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements/development.txt
      - name: Run migrations check
        run: python manage.py makemigrations --check --dry-run
      - name: Run tests
        run: python manage.py test tests -v 2

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t workforce-backend:${{ github.sha }} .
