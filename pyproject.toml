[project]
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["**/migrations/*", ".venv"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "DJ",  # django-specific
]
ignore = [
    "RUF012", # mutable class attributes are idiomatic in Django Meta/ViewSets
    "DTZ011", # date.today() is intentional for business dates
    "B017",   # blind assertRaises used deliberately in concurrency test
    "B904",   # raise-from inside service translation helpers adds noise
    "DJ001",  # nullable condition columns intentionally use NULL
]

[tool.ruff.lint.per-file-ignores]
# Django's split-settings convention relies on star imports from base.py.
"config/settings/*" = ["F403", "F405"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "config"]
